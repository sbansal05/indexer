[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
yellowstone-grpc-client = "13.5"
yellowstone-grpc-proto = "12.7"
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "bigdecimal"] }
shipstern-spl-token-parser = "0.9.0"
shipstern-core = "0.9.0"
bs58 = "0.5"
dotenvy = "0.15"